      <stop offset="0" stop-color="#4263eb"/>
      <stop offset="1" stop-color="#15aabf"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#refex-bg)"/>
  <!-- Referentials: three stacked layers -->
