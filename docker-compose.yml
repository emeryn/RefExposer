name: refexposer

x-proxy-env: &proxy-env
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,backend,frontend}

# Where the build takes its base images and its packages. Every default is the public one; point them at the
# company repositories to build without reaching the Internet (see enterprise/README.md).
x-build-sources: &build-sources
  PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
  APT_MIRROR: ${APT_MIRROR:-}
  PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  PIP_EXTRA_ARGS: ${PIP_EXTRA_ARGS:-}
  OS_UPDATE: ${OS_UPDATE:-1}
  DUCKDB_EXTENSION_REPOSITORY: ${DUCKDB_EXTENSION_REPOSITORY:-}

# Containers run as unprivileged accounts, without Linux capabilities, on a read-only root filesystem:
# only the volumes and /tmp (in memory) are writable
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: refexposer
      POSTGRES_USER: refexposer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-refexposer}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refexposer -d refexposer"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Runs once before the backend: gives ./data and ./import to the account of the backend (files left by an
  # older image running as root, or copied on the host). Only the capabilities needed to change owners.
  init-permissions:
    build: &backend-build
      context: ./backend
      target: runtime
      args:
        <<: [*proxy-env, *build-sources]
        # Account running the backend: owner of ./data and ./import on the host (see README, "Containers")
        REFEX_UID: ${REFEX_UID:-10001}
        REFEX_GID: ${REFEX_GID:-10001}
        # Version a locally built image reports. Deliberately its own variable: REFEX_VERSION picks which
        # image tag to run and is read into the container environment, so it must not stamp a version too.
        REFEX_BUILD_VERSION: ${REFEX_BUILD_VERSION:-0.0.0+dev}
    image: emeryn/refexposer-backend:${REFEX_VERSION:-latest}
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - |
        find /data /import ! -user refex -exec chown refex:refex {} + &&
        find /data /import ! -group refex -exec chgrp refex {} + &&
        echo "data and import folders belong to refex"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    healthcheck:
      disable: true
    restart: "no"
    volumes:
      - ./data:/data
      - ./import:/import

  backend:
    build: *backend-build
    image: emeryn/refexposer-backend:${REFEX_VERSION:-latest}
    restart: unless-stopped
    <<: *hardening
    # Processors and memory of the backend (0: no limit). On a workstation, keep some for the host, e.g.
    # REFEX_CPUS=6 and REFEX_MEMORY=16g: the imports of large sources then work on disk instead of starving the machine
    cpus: ${REFEX_CPUS:-0}
    mem_limit: ${REFEX_MEMORY:-0}
    depends_on:
      db:
        condition: service_healthy
      init-permissions:
        condition: service_completed_successfully
    # Every REFEX_* variable defined in .env is passed on (see README)
    env_file:
      - path: .env
        required: false
    environment:
      <<: *proxy-env
      # URL used to reach RefExposer (browsers, API clients, OpenID Connect callback, generated API docs)
      REFEX_PUBLIC_URL: ${REFEX_PUBLIC_URL:-http://localhost:8080}
      REFEX_DATABASE_URL: postgresql+psycopg://refexposer:${POSTGRES_PASSWORD:-refexposer}@db:5432/refexposer
      # Initial administrator: created at startup when no active administrator exists.
      # The password must be changed at first sign-in.
      REFEX_ADMIN_USERNAME: ${REFEX_ADMIN_USERNAME:-admin}
      REFEX_ADMIN_PASSWORD: ${REFEX_ADMIN_PASSWORD:-ChangeMe-Now-2026!}
      REFEX_ADMIN_EMAIL: ${REFEX_ADMIN_EMAIL:-}
      REFEX_ADMIN_MUST_CHANGE_PASSWORD: ${REFEX_ADMIN_MUST_CHANGE_PASSWORD:-true}
      # Set to true (once) to reset the password of this administrator
      REFEX_ADMIN_RESET_PASSWORD: ${REFEX_ADMIN_RESET_PASSWORD:-false}
      # false: no username / password sign-in for local accounts (single sign-on only, see README)
      REFEX_LOCAL_LOGIN: ${REFEX_LOCAL_LOGIN:-true}
      REFEX_SESSION_TTL_HOURS: ${REFEX_SESSION_TTL_HOURS:-12}
      REFEX_COOKIE_SECURE: ${REFEX_COOKIE_SECURE:-false}
      REFEX_PASSWORD_MIN_LENGTH: ${REFEX_PASSWORD_MIN_LENGTH:-12}
      # Encryption key of the secrets stored in the database (generated in data/.secret_key when empty)
      REFEX_SECRET_KEY: ${REFEX_SECRET_KEY:-}
      # Level of the container logs: trace, debug, info, warning, error, critical
      REFEX_LOG_LEVEL: ${REFEX_LOG_LEVEL:-info}
      REFEX_REFRESH_ON_STARTUP: ${REFEX_REFRESH_ON_STARTUP:-missing}
      REFEX_SCHEDULER_ENABLED: ${REFEX_SCHEDULER_ENABLED:-true}
      REFEX_TIMEZONE: ${REFEX_TIMEZONE:-Europe/Paris}
      REFEX_MAX_CONCURRENT_JOBS: ${REFEX_MAX_CONCURRENT_JOBS:-2}
      REFEX_HTTP_VERIFY: ${REFEX_HTTP_VERIFY:-true}
      # New attempts of a download when the remote site fails (like curl --retry; per source: source.retries)
      REFEX_DOWNLOAD_RETRIES: ${REFEX_DOWNLOAD_RETRIES:-5}
      # Memory / threads of DuckDB. Empty: sized on the container (an update gets 60 % of the memory shared between
      # REFEX_MAX_CONCURRENT_JOBS, and half of the processors; the query engine 25 %), beyond which it works on disk
      REFEX_DUCKDB_MEMORY_LIMIT: ${REFEX_DUCKDB_MEMORY_LIMIT:-}
      REFEX_DUCKDB_THREADS: ${REFEX_DUCKDB_THREADS:-}
      REFEX_MIN_FREE_DISK: ${REFEX_MIN_FREE_DISK:-5GB}
      REFEX_KEEP_RAW_MAX: ${REFEX_KEEP_RAW_MAX:-10GB}
      REFEX_FULL_SCAN_MAX: ${REFEX_FULL_SCAN_MAX:-20GB}
      REFEX_SQL_TIMEOUT: ${REFEX_SQL_TIMEOUT:-30}
      REFEX_SQL_MAX_ROWS: ${REFEX_SQL_MAX_ROWS:-10000}
      REFEX_API_MAX_LIMIT: ${REFEX_API_MAX_LIMIT:-1000}
      REFEX_EXPORT_MAX_ROWS: ${REFEX_EXPORT_MAX_ROWS:-5000000}
      REFEX_KEEP_RUNS: ${REFEX_KEEP_RUNS:-200}
      REFEX_LARGE_ROWS: ${REFEX_LARGE_ROWS:-50000000}
      REFEX_QUERY_TIMEOUT: ${REFEX_QUERY_TIMEOUT:-60}
      # Import folder: files copied into import/<referential id>/ become a new version
      REFEX_IMPORT_DIR: ${REFEX_IMPORT_DIR:-/import}
      REFEX_IMPORT_POLL_SECONDS: ${REFEX_IMPORT_POLL_SECONDS:-20}
      # Sync folder: each file or folder pushed into sync/ is a referential, re-imported when its files change
      REFEX_SYNC_DIR: ${REFEX_SYNC_DIR:-/sync}
      REFEX_SYNC_POLL_SECONDS: ${REFEX_SYNC_POLL_SECONDS:-60}
      REFEX_SYNC_SETTLE_SECONDS: ${REFEX_SYNC_SETTLE_SECONDS:-30}
      TZ: ${REFEX_TIMEZONE:-Europe/Paris}
    volumes:
      - ./data:/data
      - ./config:/app/config:ro
      - ./import:/import
      - ./sync:/sync:ro
    # The API is served through the frontend under /api. To expose it directly,
    # uncomment (or use a docker-compose.override.yml):
    # ports:
    #   - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        <<: *proxy-env
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.31-alpine-slim}
        APK_MIRROR: ${APK_MIRROR:-}
        OS_UPDATE: ${OS_UPDATE:-1}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        NPM_EXTRA_ARGS: ${NPM_EXTRA_ARGS:-}
    image: emeryn/refexposer-frontend:${REFEX_VERSION:-latest}
    restart: unless-stopped
    <<: *hardening
    # nginx writes its temporary files (request bodies, proxy buffers) to /var/cache/nginx
    tmpfs: ["/tmp", "/var/cache/nginx"]
    environment:
      # Where to reach the backend. nginx resolves it at each request rather than once at start-up, so the
      # interface follows a backend container that comes back on another address (frontend/nginx.conf.template)
      REFEX_BACKEND: ${REFEX_BACKEND:-backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:8080"

volumes:
  db-data:
