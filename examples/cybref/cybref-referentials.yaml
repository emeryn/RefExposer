# CybrefV2 referentials for RefExposer (https://github.com/emeryn/CybrefV2)
#
# 124 cybersecurity referentials (threat intelligence, LOL binaries, vulnerabilities, ATT&CK and other frameworks,
# cloud / VPN / Tor IP ranges, registries, detection lists), read from the daily mirror of CybrefV2 on GitHub.
#
# Import: Administration › Referentials › Import (the plan shows what is created), or
#         POST /api/admin/config/import, or drop this file into config/ (read like any definition file).
# Every definition was built and checked with RefExposer before being written here (see README.md).
#
# - Each referential is checked every day at 07:xx (minute spread to avoid a burst); unchanged files answer HTTP 304.
# - Rolling feeds (ThreatFox, MalwareBazaar, ransomware.live victims) use merge: each download is a delta added to the
#   published data, so the referential keeps the history beyond the window of the feed.
# - nvd_cve (27 yearly files, 2.7 GB of JSON) needs about 8 GB of memory for the backend: remove it on a small host.
# - Not included: mitre_atlas and bluetooth_company_ids (YAML), curl_ca_bundle (PEM): not tables.
refexposer_export:
  format: refexposer-config
  version: 1
  exported_at: '2026-10-17T00:00:00+00:00'
  exported_by: examples/cybref
  instance: https://github.com/emeryn/CybrefV2
  credentials: masked
  referentials: 124
referentials:
- id: abusech_feodotracker_c2_ips
  name: Feodo Tracker
  description: Botnet C2 servers (Dridex, Emotet, QakBot, Pikabot...).
  category: Threat Intelligence & IOCs
